name: NIKAHYA CI

# Validation sur PR et main : staging léger sans déploiement Cloudflare ni accès à Neon de production.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nikahya-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit tests, lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Build Cloudflare Worker
        run: npm run build:worker

  playwright:
    name: Playwright browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  two-user-production-e2e:
    name: Real two-user journey on Cloudflare production
    if: ${{ vars.ENABLE_TWO_USER_E2E == 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: https://nikahya.rassoul-ali.workers.dev
      E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
      E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
      E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
      E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Require two dedicated existing accounts
        shell: bash
        run: |
          set -euo pipefail
          test -n "$E2E_USER_A_EMAIL" || { echo "::error::Missing secret E2E_USER_A_EMAIL"; exit 1; }
          test -n "$E2E_USER_A_PASSWORD" || { echo "::error::Missing secret E2E_USER_A_PASSWORD"; exit 1; }
          test -n "$E2E_USER_B_EMAIL" || { echo "::error::Missing secret E2E_USER_B_EMAIL"; exit 1; }
          test -n "$E2E_USER_B_PASSWORD" || { echo "::error::Missing secret E2E_USER_B_PASSWORD"; exit 1; }
      - name: Run real two-user journey
        run: npx playwright test tests/e2e/two-user-full-journey.spec.ts --workers=1
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: two-user-production-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
