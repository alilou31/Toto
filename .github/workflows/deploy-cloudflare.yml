name: Deploy NIKAHYA to Cloudflare Workers

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nikahya-cloudflare-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm package downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-v1-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-v1-
      - name: Install dependencies
        timeout-minutes: 12
        run: bash scripts/ci-install.sh
      - name: Build Worker (no deployment)
        run: npm run build:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: https://nakahya.com
      - name: Verify existing official DNS and HTTPS (read-only)
        run: node scripts/check-domain.mjs

  deploy:
    name: Deploy to Cloudflare production
    # Production is deployable only from main; PRs and manual runs on feature branches never deploy.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm package downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-v1-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-v1-
      - name: Install dependencies
        timeout-minutes: 12
        run: bash scripts/ci-install.sh
      - name: Validate deployment secrets
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$DATABASE_URL" && test -n "$NEXT_PUBLIC_SITE_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: https://nakahya.com
      - name: Build and deploy Worker
        run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: https://nakahya.com
      - name: Configure Neon connection secret on the Worker
        run: printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Configure Resend API key on the Worker when available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          else
            echo "::warning::RESEND_API_KEY is not configured in GitHub Actions; password recovery will remain unavailable until the secret is added."
          fi


      # Fail the release if the official domain does not run this Worker.
      # Only an invalid token is posted; no account, email or database write.
      - name: Verify official domain serves newly deployed routes
        env:
          PRODUCTION_URL: https://nakahya.com
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            page_status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL/confirmer-email" || true)"
            api_status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{"token":"invalide"}' "$PRODUCTION_URL/api/auth/confirm-email" || true)"
            echo "Domain check $attempt: confirmation page=$page_status (200 expected), invalid-token API=$api_status (400 expected)"
            if [ "$page_status" = "200" ] && [ "$api_status" = "400" ]; then
              echo "Official domain serves new routes; no user data written."
              exit 0
            fi
            sleep 5
          done
          echo "::error::nakahya.com is not serving the current Worker routes; inspect Cloudflare Workers & Pages > nikahya > Settings > Domains & Routes."
          exit 1
