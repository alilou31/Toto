name: NIKAHYA Production Smoke Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: nikahya-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Check live Cloudflare production and Neon
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_URL: https://10636d14-nikhaya.rassoul-ali.workers.dev
    steps:
      - name: Check production homepage
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --max-time 20 \
            --output /dev/null \
            --write-out 'Homepage HTTP %{http_code} in %{time_total}s\n' \
            "$PRODUCTION_URL/"

      - name: Check demo page
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --max-time 20 \
            --output /dev/null \
            --write-out 'Demo HTTP %{http_code} in %{time_total}s\n' \
            "$PRODUCTION_URL/demo"

      - name: Check live Neon database connectivity
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --max-time 20 \
            --output /tmp/db-check.json \
            --write-out 'Database health endpoint HTTP %{http_code} in %{time_total}s\n' \
            "$PRODUCTION_URL/api/db-check"
          node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync("/tmp/db-check.json", "utf8"));
            if (result.ok !== true || result.status !== "connected") {
              console.error("Database health check did not confirm connectivity:", {
                ok: result.ok,
                status: result.status,
                message: result.message
              });
              process.exit(1);
            }
            console.log("Neon connectivity confirmed; databaseTime:", result.databaseTime ?? "not returned");
          '

  interface:
    name: Playwright interface tests on production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BASE_URL: https://10636d14-nikhaya.rassoul-ali.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run read-only production UI tests
        run: npx playwright test tests/e2e/production-ui.spec.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
