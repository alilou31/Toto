name: NIKAHYA Production Smoke Tests

# Read-only checks against the currently published Cloudflare Worker.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
  workflow_run:
    workflows:
      - Deploy NIKAHYA to Cloudflare Workers
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nikahya-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Check live Cloudflare production and Neon
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_URL: https://nikahya.rassoul-ali.workers.dev
    steps:
      - name: Check production homepage
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 20 --output /dev/null --write-out 'Homepage HTTP %{http_code} in %{time_total}s\n' "$PRODUCTION_URL/"
      - name: Check demo page
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 20 --output /dev/null --write-out 'Demo HTTP %{http_code} in %{time_total}s\n' "$PRODUCTION_URL/demo"
      - name: Check live Neon database connectivity
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 20 --output /tmp/db-check.json --write-out 'Database health endpoint HTTP %{http_code} in %{time_total}s\n' "$PRODUCTION_URL/api/db-check"
          node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync("/tmp/db-check.json", "utf8"));
            if (result.ok !== true || result.status !== "connected") {
              console.error("Database health check did not confirm connectivity:", { ok: result.ok, status: result.status, message: result.message });
              process.exit(1);
            }
            console.log("Neon connectivity confirmed; databaseTime:", result.databaseTime ?? "not returned");
          '
      - name: Verify game history requires authentication
        run: |
          status=$(curl --silent --show-error --location --max-time 20 --output /tmp/game-results.json --write-out '%{http_code}' "$PRODUCTION_URL/api/games/results")
          test "$status" = "401"
          node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync("/tmp/game-results.json", "utf8"));
            if (result.error !== "Authentification requise.") {
              console.error("Game results endpoint did not reject an anonymous request as expected.");
              process.exit(1);
            }
            console.log("Game results endpoint correctly rejects anonymous access.");
          '
  # Exécuter Playwright après chaque déploiement réussi, et aussi lors du cron ou d'un lancement manuel.
  # Ces tests sont en lecture seule et ne créent aucun compte ni donnée métier.
  interface:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    name: Playwright interface tests on production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BASE_URL: https://nikahya.rassoul-ali.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --fetch-retries=3 --fetch-retry-factor=2 --fetch-retry-mintimeout=5000 --fetch-retry-maxtimeout=30000
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run read-only production UI tests
        run: npx playwright test tests/e2e/production-ui.spec.ts tests/e2e/api-json-contract.spec.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
