name: NAKAHYA Mobile — iOS simulator build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/mobile-ios.yml"

permissions:
  contents: read

concurrency:
  group: nakahya-mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: Build iOS simulator app (unsigned)
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate iOS native project
        run: npx cap add ios
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: Build for iOS simulator
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package simulator app
        run: |
          cd build/ios/Build/Products/Debug-iphonesimulator
          zip -r "${GITHUB_WORKSPACE}/nakahya-ios-simulator.zip" App.app
      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: nakahya-ios-simulator
          path: nakahya-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
